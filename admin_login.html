<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | City Care Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <a class="brand" href="/index.html">
            <span class="cross" aria-hidden="true"></span>
            <span>City Care Hospital<small>Online appointments</small></span>
        </a>
        <nav aria-label="Main">
            <a href="/index.html">Home</a>
            <a href="/doctors.html">Doctors</a>
            <a href="/appointment.html">Book appointment</a>
            <a href="/my_appointments">My appointments</a>
            <a href="/register.html">Register</a>
            <a href="/login.html">Login</a>
            <a href="/admin_login.html" class="active" aria-current="page">Admin</a>
            <a href="/logout">Logout</a>
        </nav>
    </div>
</header>

<main>

    <div class="page-title">
        <h1>Admin login</h1>
        <p>For hospital staff, to confirm or reject appointment requests.</p>
    </div>

    <form class="form-card" action="/admin_login" method="POST">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Log in as admin</button>
    </form>
</main>

<footer>
    <div class="inner">
        <p>Cloud-Based Hospital Appointment System</p>
        <p>&copy; 2026 City Care Hospital</p>
    </div>
</footer>

</body>
</html>
